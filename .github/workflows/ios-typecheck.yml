name: iOS Source Typecheck

on:
  push:
    branches:
      - port/xapk-ui
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck iOS sources
        run: |
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            -typecheck \
            Sources/HyperDroidIOS/*.swift \
            -framework Foundation \
            -framework SwiftUI \
            -framework UIKit \
            -framework WebKit
      - name: Validate XTool manifest
        run: python3 -m json.tool xtool-mobile.json >/dev/null
      - name: Validate XAPK atlas resource
        run: |
          python3 - <<'PY'
          import pathlib, struct
          p = pathlib.Path("Resources/hyperdroid_ui_atlas.png")
          raw = p.read_bytes()
          assert raw[:8] == b"\x89PNG\r\n\x1a\n", "atlas is not a PNG"
          width, height = struct.unpack(">II", raw[16:24])
          assert (width, height) == (384, 268), (width, height)
          print(f"XAPK atlas OK: {width}x{height}, {len(raw)} bytes")
          PY
